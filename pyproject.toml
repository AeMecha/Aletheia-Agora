[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aletheia-agora"
version = "0.1.1"
description = "Aletheia Agora: a FastAPI personal knowledge library with a vanilla browser interface."
requires-python = ">=3.12"
license = "LicenseRef-Aletheia-Distribution"
license-files = ["LICENSE", "NOTICE", "LICENSING.md", "ATTRIBUTION.md", "LICENSES/*.txt"]
readme = "README.md"
dependencies = [
  "fastapi==0.116.1", "uvicorn==0.35.0", "httpx==0.28.1",
  "filelock==3.29.4",
]

[project.optional-dependencies]
semantic = ["numpy>=2,<3", "onnxruntime>=1.20,<2", "tokenizers>=0.22,<1"]

[project.scripts]
aletheia-agora = "aletheia_agora.__main__:main"

[project.urls]
Repository = "https://github.com/AeMecha/Aletheia-Agora"
Upstream = "https://github.com/AdeptTel1/Aletheia"
"Implementation lineage" = "https://github.com/AeMecha/Aletheia-Scriptorium"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aletheia_core = ["data/*.json", "data/prompts/*.md", "data/prompts/*.txt"]
aletheia_agora = ["static/*"]
